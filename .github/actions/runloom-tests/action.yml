# runloom-tests -- build the runloom C extension against the provided patched
# interpreter and run runloom's own suite.  These are the two REQUIRED phases
# that run identically whether the interpreter was built here or downloaded, so
# they live in one composable step consumed by every path.
#
# The interpreter is located via the $RL_CI_WORK/pybin-<version>-<platform>.txt
# breadcrumb that provide-cpython wrote (test_patched_cpython.sh reads it), so no
# path needs to be threaded in.
name: runloom-tests
description: Build the runloom extension and run the runloom suite against a provided CPython.
inputs:
  version:
    description: CPython version, major.minor.patch (must match provide-cpython).
    required: true
  suite:
    description: "cheap (push/PR: python suite + mn/replay/ctest) or full (weekly: check_all_fast)."
    default: cheap
  timeout-mult:
    description: run_isolated deadline scaler for slow shared runners.
    required: false
    default: "2"
runs:
  using: composite
  steps:
    - name: Build runloom extension (${{ inputs.version }})
      shell: bash
      run: tools/ci/test_patched_cpython.sh "${{ inputs.version }}" --only=build-ext

    - name: Run runloom tests (${{ inputs.version }})
      shell: bash
      env:
        # Widen run_isolated deadlines on small shared runners so timing-sensitive
        # scheduler tests do not false-fail under load (kept modest -- a genuine
        # deadlock still fails in ~300s*mult per file, inside the job cap).
        RUNLOOM_TIMEOUT_MULT: ${{ inputs.timeout-mult }}
        # NOTE: there is deliberately no RUNLOOM_CI here.  The suite used to
        # self-skip ~20 environment-sensitive tests when it was set; those skips
        # were removed so a hosted runner is a real datapoint rather than a
        # quieter one.  If something fails only on a runner, that is the finding.
        RL_CI_SUITE: ${{ inputs.suite }}
        # run_isolated defaults to one worker per core (j=4 on ubuntu-latest).
        # That is right for a build gate and wrong here: several of these files
        # measure CONCURRENCY against wall-clock deadlines -- 50 simultaneous
        # echo connections, hang_guard(40) -- and four of them sharing four
        # cores leaves each about one core to prove parallelism with.
        # test_swarm_aio_bridge hung under exactly that (reproduced locally with
        # RUNLOOM_TEST_JOBS=4 + taskset -c 0-3).
        #
        # Halving it is not reduced coverage: every file still runs, just less
        # overlapped. It costs wall-clock, which is free on a public repo.
        # NOTE this is mitigation, not a cure -- the underlying load sensitivity
        # in the aio bridge is still real and still worth fixing.
        RUNLOOM_TEST_JOBS: "2"
      run: tools/ci/test_patched_cpython.sh "${{ inputs.version }}" --only=runloom-tests
