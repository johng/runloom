# Patched free-threaded CPython -- build, test, and (on merge to dev) release.
#
# NOTE ON POLICY: CLAUDE.md says "never add GitHub Actions".  This workflow is
# added at the explicit, repeated request of the maintainer, which overrides
# that standing note.  If that decision is reversed, delete this file -- nothing
# else depends on it; tools/ci/*.sh run identically on a laptop or a self-hosted
# runner.
#
# WHAT IT DOES
#   * Input is a list of full CPython versions (major.minor.patch).  Each version
#     resolves ITS OWN patch pair, sha256, and test exclusions -- entirely inside
#     tools/ci (rl_*_of_version in lib.sh), so this file just forwards versions.
#   * For every (version x OS) it applies the patches at zero fuzz, builds
#     free-threaded CPython with both migration features, and requires BOTH the
#     CPython stdlib suite AND the runloom validation to pass.
#   * On push to dev it packages each build and publishes them as a GitHub
#     Release -- i.e. merging to dev generates the patched interpreters.
#
# The single source of truth for HOW to build/test/patch is tools/ci/*.sh.  This
# workflow is a thin trigger around ci.sh; keep logic there, not here.

name: patched-cpython

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "CPython versions to build (major.minor.patch, space/comma separated). Blank = repo default (RL_CI_VERSIONS in tools/ci/versions.env)."
        required: false
        default: ""
  pull_request:
    paths:
      - "src/patches/**"
      - "tools/ci/**"
      - ".github/workflows/patched-cpython.yml"
      - "setup.py"
      - "src/runloom_c/**"
  push:
    branches: [dev, main]

permissions:
  contents: write        # the release job attaches artifacts to a Release

concurrency:
  group: patched-cpython-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- fast feedback: do the patches still apply at zero fuzz? (~1 min) ------
  patch-gate:
    runs-on: ubuntu-latest
    env:
      VERSIONS_INPUT: ${{ github.event.inputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Zero-fuzz patch-apply gate
        run: |
          set -eu
          if [ -n "${VERSIONS_INPUT:-}" ]; then
            RL_CI_VERSIONS="$(printf '%s' "$VERSIONS_INPUT" | tr ',' ' ')" \
              tools/ci/check_patches.sh
          else
            tools/ci/check_patches.sh
          fi

  # ---- turn the version list into a matrix ----------------------------------
  resolve:
    runs-on: ubuntu-latest
    needs: patch-gate
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    env:
      VERSIONS_INPUT: ${{ github.event.inputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        name: Resolve version matrix
        run: |
          set -eu
          RAW="${VERSIONS_INPUT:-}"
          if [ -z "$RAW" ]; then
            # shellcheck disable=SC1091
            . tools/ci/versions.env
            RAW="$RL_CI_VERSIONS"
          fi
          RAW="$(printf '%s' "$RAW" | tr ',' ' ')"
          json=""
          for v in $RAW; do
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::bad version '$v' (want major.minor.patch)"; exit 1 ;;
            esac
            json="$json\"$v\","
          done
          [ -n "$json" ] || { echo "::error::no versions to build"; exit 1; }
          echo "versions=[${json%,}]" >> "$GITHUB_OUTPUT"
          echo "matrix: [${json%,}]"

  # ---- build + test each (version x OS) -------------------------------------
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.resolve.outputs.versions) }}
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.version }} (${{ matrix.os }})
    env:
      # regrtest per-test timeout; runners are slower than the dev box.  (Only
      # constants belong in job-level env -- the `runner` context is not
      # available here, so RL_CI_WORK/RL_CI_RELEASE_PREFIX are set per-step.)
      RL_CI_TEST_TIMEOUT: "1200"
    steps:
      - uses: actions/checkout@v4

      - name: Install CPython build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libssl-dev zlib1g-dev libbz2-dev liblzma-dev \
            libffi-dev libsqlite3-dev libreadline-dev libncursesw5-dev \
            libgdbm-dev libgdbm-compat-dev uuid-dev tk-dev
          # A JDK is present on GH runners, but spin/cbmc are not; the formal lane
          # skips what it cannot run and is a SOFT gate regardless.

      - name: Install CPython build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 xz gdbm || true

      # Share the build/test tree across the steps below (kept off the checkout
      # so nothing is committed by accident; per-version prefix so artifacts
      # never collide).  runner.* is only available at step level, so publish
      # these to $GITHUB_ENV once for every later step to inherit.
      - name: Configure CI paths
        run: |
          echo "RL_CI_WORK=${{ runner.temp }}/rl-ci" >> "$GITHUB_ENV"
          echo "RL_CI_RELEASE_PREFIX=${{ runner.temp }}/rl-prefix" >> "$GITHUB_ENV"

      # ---- the four REQUIRED phases, one visible step each -------------------

      - name: 1. Build patched CPython ${{ matrix.version }}
        run: |
          set -eu
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Point configure at Homebrew openssl so _ssl / _hashlib build (else
            # test_ssl et al. only skip and the released interpreter has no TLS).
            EXTRA="--with-openssl=$(brew --prefix openssl@3)"
          fi
          RL_CI_CONFIGURE_EXTRA="$EXTRA" tools/ci/build_patched_cpython.sh "${{ matrix.version }}"

      - name: 2. Test patched CPython (CPython stdlib suite)
        run: tools/ci/test_patched_cpython.sh "${{ matrix.version }}" --only=cpython

      - name: 3. Build runloom extension
        run: tools/ci/test_patched_cpython.sh "${{ matrix.version }}" --only=build-ext

      - name: 4. Run runloom tests
        env:
          # Hosted runners are small; widen every run_isolated deadline so
          # timing-sensitive scheduler tests do not false-fail under load.
          RUNLOOM_TIMEOUT_MULT: "4"
        run: tools/ci/test_patched_cpython.sh "${{ matrix.version }}" --only=runloom-tests

      # Package only on a merge to dev (PR / dispatch runs skip the ~100MB tar).
      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: tools/ci/package_release.sh "${{ matrix.version }}"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.version }}-${{ matrix.os }}
          path: ${{ runner.temp }}/rl-ci/*.log
          if-no-files-found: ignore
          retention-days: 7

      # Artifacts are published ONLY on a merge to dev -- PR / dispatch runs
      # build and test but never upload.  The release job below consumes these.
      - name: Upload patched-CPython artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: runloom-cpython-${{ matrix.version }}-${{ matrix.os }}
          path: dist/patched-cpython/*
          if-no-files-found: error
          retention-days: 14

  # ---- on merge to dev: publish the generated interpreters -----------------
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: runloom-cpython-*
          merge-multiple: true
      - name: Assemble combined SHA256SUMS
        run: |
          set -eu
          cd incoming
          ls -la
          # Each build job produced a per-platform SHA256SUMS; concatenate into
          # one authoritative manifest for the release.
          : > SHA256SUMS
          for f in *.tar.gz; do
            sha256sum "$f" >> SHA256SUMS
          done
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="patched-cpython-run${{ github.run_number }}"
          NOTES="Free-threaded CPython patched with runloom's cross-hub migration
          features (Py_TSTATE_ALLOC_HOME + Py_TSTATE_EXEC_HOME), generated from
          commit ${{ github.sha }}. Each .json records the exact upstream release,
          patch content hashes, and build prefix.

          Download a tarball, verify against SHA256SUMS, extract anywhere, and run
          bin/pythonX.Yt -- the interpreter resolves its stdlib and headers
          relative to its own location. (sysconfig.get_config_var('prefix') still
          reports the build path; cosmetic, matters only when compiling extensions
          against the install.)"
          cd incoming
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Patched CPython — run ${{ github.run_number }}" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            *.tar.gz *.json SHA256SUMS
